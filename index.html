<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Analyzer Lite</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#000;font-family:'Courier New',monospace;color:#0f0;padding:20px;transition:0.3s;}
        body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,255,0,.02)0px,rgba(0,255,0,.02)2px,transparent 2px,transparent 6px);pointer-events:none;z-index:9999;}
        .container{max-width:1300px;margin:0 auto;position:relative;z-index:1;}
        .header{text-align:center;margin-bottom:30px;border-bottom:2px solid #0f0;padding-bottom:20px;}
        h1{font-size:2rem;letter-spacing:3px;text-shadow:0 0 8px #0f0;}
        .theme-selector{display:flex;justify-content:center;gap:12px;margin-top:15px;}
        .theme-btn{background:none;border:1px solid #0f0;color:#0f0;padding:5px 15px;border-radius:30px;cursor:pointer;font-family:monospace;}
        .theme-btn.active,.theme-btn:hover{background:#0f0;color:#000;}
        .search-area{background:rgba(0,20,0,.5);padding:20px;border-radius:20px;margin:20px 0;text-align:center;backdrop-filter:blur(4px);}
        .search-area input{background:#111;border:1px solid #0f0;padding:10px 15px;color:#0f0;font-family:monospace;width:60%;max-width:300px;border-radius:30px;outline:none;}
        .search-area button{background:#0a0f0a;border:1px solid #0f0;color:#0f0;padding:10px 20px;border-radius:30px;cursor:pointer;font-family:monospace;margin-left:10px;}
        .search-area button:hover{background:#0f0;color:#000;}
        .helper-text{font-size:0.7rem;margin-top:8px;opacity:0.7;}
        .stats{background:rgba(0,30,0,.6);padding:6px 15px;border-radius:30px;display:inline-block;margin-bottom:15px;}
        .table-wrapper{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;background:#0a0f0a;}
        th,td{border:1px solid #0f0;padding:8px 10px;text-align:left;vertical-align:middle;}
        th{background:#0a1a0a;}
        .status-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:bold;}
        .status-green{background:#0f0;color:#000;}
        .status-red{background:#f33;color:#000;}
        .status-yellow{background:#ccff00;color:#000;}
        .status-unknown{background:#555;color:#fff;}
        .link-cell a{color:#0f0;}
        .verify-btn{background:none;border:1px solid #0f0;color:#0f0;padding:3px 8px;border-radius:20px;cursor:pointer;font-family:monospace;}
        .verify-btn:hover{background:#0f0;color:#000;}
        .pagination{display:flex;justify-content:center;gap:8px;margin-top:20px;}
        .pagination button{background:#0a0f0a;border:1px solid #0f0;color:#0f0;padding:5px 12px;border-radius:20px;cursor:pointer;}
        .pagination button.active{background:#0f0;color:#000;}
        footer{text-align:center;margin-top:40px;padding:15px;border-top:1px solid #0f0;font-size:.7rem;}
        body.light-theme{background:#eef4ee;color:#004d00;}
        body.light-theme::before{background:none;}
        body.light-theme .header,body.light-theme footer{border-color:#2b6e2b;}
        body.light-theme h1{text-shadow:0 0 4px #2b6e2b;color:#004d00;}
        body.light-theme .search-area,body.light-theme .stats,body.light-theme table{background:#fff;}
        body.light-theme input,body.light-theme button,body.light-theme .theme-btn{background:#fff;border-color:#2b6e2b;color:#004d00;}
        body.light-theme button:hover,body.light-theme .theme-btn.active{background:#2b6e2b;color:#fff;}
        body.light-theme th{background:#e0e8e0;}
        body.light-theme .link-cell a{color:#006600;}
        body.light-theme .verify-btn{border-color:#2b6e2b;color:#006600;}
        body.light-theme .verify-btn:hover{background:#2b6e2b;color:#fff;}
        body.amber-theme{background:#1c160c;color:#ffb347;}
        body.amber-theme::before{background:repeating-linear-gradient(0deg,rgba(255,180,71,.03)0px,rgba(255,180,71,.03)2px,transparent 2px,transparent 6px);}
        body.amber-theme .header,body.amber-theme footer{border-color:#ffb347;}
        body.amber-theme h1{text-shadow:0 0 8px #ffb347;color:#ffb347;}
        body.amber-theme .search-area,body.amber-theme .stats,body.amber-theme table{background:#2a2418;}
        body.amber-theme input,body.amber-theme button,body.amber-theme .theme-btn{background:#2a2418;border-color:#ffb347;color:#ffb347;}
        body.amber-theme button:hover,body.amber-theme .theme-btn.active{background:#ffb347;color:#1c160c;}
        body.amber-theme th{background:#3a3018;}
        body.amber-theme .link-cell a{color:#ffb347;}
        body.amber-theme .verify-btn{border-color:#ffb347;color:#ffb347;}
        body.amber-theme .verify-btn:hover{background:#ffb347;color:#1c160c;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔎 Social Analyzer Lite</h1>
        <div class="theme-selector">
            <button class="theme-btn" data-theme="dark">🌙 Matrix</button>
            <button class="theme-btn" data-theme="light">☀️ Claro</button>
            <button class="theme-btn" data-theme="amber">🟠 Ámbar</button>
        </div>
    </div>
    <div class="search-area">
        <input type="text" id="username" placeholder="ej: johndoe (sin @)" autocomplete="off">
        <button id="searchBtn">🔍 Buscar</button>
        <div class="helper-text">⚠️ Introduce solo el nombre de usuario, <strong>sin el símbolo @</strong>. Ejemplo: "pepito" no "@pepito"</div>
    </div>
    <div id="results"></div>
    <footer>⚡ Enlaces directos + verificación manual · Datos locales</footer>
</div>
<script>
    // Lista compacta de plataformas (las más importantes)
    const sites = [
        "Twitter","Instagram","Facebook","LinkedIn","GitHub","Reddit","YouTube","TikTok","Twitch","Pinterest",
        "Snapchat","Telegram","Discord","Spotify","Medium","DeviantArt","Flickr","Dribbble","Behance","Vimeo",
        "SoundCloud","Tumblr","GitLab","Bitbucket","Keybase","HackerNews","ProductHunt","Mastodon","Steam","Codecademy",
        "Dev.to","Gravatar","Pastebin","Replit","Codepen","LeetCode","HackerRank","Kaggle","ResearchGate","Academia.edu",
        "Slideshare","Bandcamp","Last.fm","Foursquare","Untappd","Strava","Imgur","Giphy","VK","Weibo","Wattpad"
    ];
    const urlPatterns = {
        Twitter:"https://twitter.com/{u}", Instagram:"https://instagram.com/{u}", Facebook:"https://facebook.com/{u}",
        LinkedIn:"https://linkedin.com/in/{u}", GitHub:"https://github.com/{u}", Reddit:"https://reddit.com/user/{u}",
        YouTube:"https://youtube.com/@{u}", TikTok:"https://tiktok.com/@{u}", Twitch:"https://twitch.tv/{u}",
        Pinterest:"https://pinterest.com/{u}", Snapchat:"https://snapchat.com/add/{u}", Telegram:"https://t.me/{u}",
        Discord:"https://discord.com/users/{u}", Spotify:"https://open.spotify.com/user/{u}", Medium:"https://medium.com/@{u}",
        DeviantArt:"https://deviantart.com/{u}", Flickr:"https://flickr.com/people/{u}", Dribbble:"https://dribbble.com/{u}",
        Behance:"https://behance.net/{u}", Vimeo:"https://vimeo.com/{u}", SoundCloud:"https://soundcloud.com/{u}",
        Tumblr:"https://{u}.tumblr.com", GitLab:"https://gitlab.com/{u}", Bitbucket:"https://bitbucket.org/{u}",
        Keybase:"https://keybase.io/{u}", HackerNews:"https://news.ycombinator.com/user?id={u}", ProductHunt:"https://producthunt.com/@{u}",
        Mastodon:"https://mastodon.social/@{u}", Steam:"https://steamcommunity.com/id/{u}", Codecademy:"https://codecademy.com/profiles/{u}",
        "Dev.to":"https://dev.to/{u}", Gravatar:"https://gravatar.com/{u}", Pastebin:"https://pastebin.com/u/{u}",
        Replit:"https://replit.com/@{u}", Codepen:"https://codepen.io/{u}", LeetCode:"https://leetcode.com/{u}",
        HackerRank:"https://hackerrank.com/{u}", Kaggle:"https://kaggle.com/{u}", ResearchGate:"https://researchgate.net/profile/{u}",
        "Academia.edu":"https://academia.edu/{u}", Slideshare:"https://slideshare.net/{u}", Bandcamp:"https://bandcamp.com/{u}",
        "Last.fm":"https://last.fm/user/{u}", Foursquare:"https://foursquare.com/user/{u}", Untappd:"https://untappd.com/user/{u}",
        Strava:"https://strava.com/athletes/{u}", Imgur:"https://imgur.com/user/{u}", Giphy:"https://giphy.com/{u}",
        VK:"https://vk.com/{u}", Weibo:"https://weibo.com/{u}", Wattpad:"https://wattpad.com/user/{u}"
    };

    let currentUser = "", results = [], page = 1, rows = 25;
    const resultsDiv = document.getElementById("results");

    function sanitizeUsername(user) {
        // Elimina cualquier @ al inicio o en medio (aunque lo ideal es solo al inicio)
        return user.replace(/@/g, '').trim();
    }

    function generateLinks(user) {
        const cleanUser = sanitizeUsername(user);
        return sites.map(s => ({ name: s, url: urlPatterns[s].replace(/\{u\}/gi, encodeURIComponent(cleanUser)) }));
    }

    async function checkUrl(url) {
        try {
            const ctrl = new AbortController();
            setTimeout(() => ctrl.abort(), 5000);
            await fetch(url, { method: 'HEAD', mode: 'no-cors', signal: ctrl.signal });
            return "green";
        } catch { return "red"; }
    }

    async function verify(btn, url, spanId) {
        const span = document.getElementById(spanId);
        span.innerHTML = '<span class="status-badge status-yellow">🟡 verificando...</span>';
        const status = await checkUrl(url);
        span.innerHTML = `<span class="status-badge status-${status}">${status === "green" ? "🟢 activo" : "🔴 caído"}</span>`;
    }

    function render() {
        if (!results.length) { resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;">🔍 Introduce un nombre de usuario (sin @)</div>'; return; }
        const start = (page-1)*rows, end = start+rows, pages = Math.ceil(results.length/rows);
        let html = `<div class="stats">📊 ${results.length} plataformas para: <strong>${escapeHtml(currentUser)}</strong></div><div class="table-wrapper"><table><thead><tr><th>Plataforma</th><th>Enlace</th><th>Estado</th><th>Acción</th></tr></thead><tbody>`;
        for (let item of results.slice(start, end)) {
            const sid = `s-${item.name.replace(/\s/g,'')}`;
            html += `<tr><td>${escapeHtml(item.name)}</td><td class="link-cell"><a href="${escapeHtml(item.url)}" target="_blank">${escapeHtml(item.url)}</a></td><td id="${sid}"><span class="status-badge status-unknown">⏳ pendiente</span></td><td><button class="verify-btn" data-url="${escapeHtml(item.url)}" data-span="${sid}">🔄 Verificar</button></td></tr>`;
        }
        html += `</tbody></table></div>`;
        if (pages > 1) { html += `<div class="pagination">`; for (let i=1;i<=pages;i++) html += `<button class="page-btn ${i===page?'active':''}" data-page="${i}">${i}</button>`; html+=`</div>`; }
        resultsDiv.innerHTML = html;
        document.querySelectorAll('.verify-btn').forEach(btn => btn.addEventListener('click', e => verify(btn, btn.dataset.url, btn.dataset.span)));
        document.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', e => { page = +btn.dataset.page; render(); }));
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    document.getElementById("searchBtn").onclick = () => {
        let user = document.getElementById("username").value.trim();
        if (!user) return alert("Ingresa un nombre de usuario (sin @)");
        currentUser = sanitizeUsername(user);
        results = generateLinks(currentUser);
        page = 1;
        render();
    };
    document.getElementById("username").addEventListener("keypress", e => { if(e.key === "Enter") document.getElementById("searchBtn").click(); });

    // Temas
    const applyTheme = (theme) => {
        document.body.classList.remove("light-theme","amber-theme");
        if(theme==="light") document.body.classList.add("light-theme");
        else if(theme==="amber") document.body.classList.add("amber-theme");
        localStorage.setItem("social_lite_theme", theme);
        document.querySelectorAll(".theme-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.theme === theme));
    };
    const saved = localStorage.getItem("social_lite_theme") || "dark";
    applyTheme(saved);
    document.querySelectorAll(".theme-btn").forEach(btn => btn.addEventListener("click", () => applyTheme(btn.dataset.theme)));
</script>
</body>
</html>
